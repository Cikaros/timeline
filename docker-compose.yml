services:
  timeline:
    build: .
    image: timeline-app:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ALLOWED_ORIGINS=https://timeline.example.com
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
